<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9Г Класс - Расписание</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <!-- Theme Switcher -->
    <button class="theme-switcher" title="Переключить тему">
        <svg class="theme-icon sun-icon" style="display: none;" viewBox="0 0 24 24">
            <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg class="theme-icon moon-icon" viewBox="0 0 24 24">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
    </button>

    <!-- Connection Status -->
    <div class="connection-status">Офлайн</div>

    <!-- Main Container -->
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="header-top">
                    <h1>9Г Класс</h1>
                    <nav class="main-nav">
                        <button class="nav-btn login-btn">
                            <svg class="nav-icon" viewBox="0 0 24 24">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                            <span>Войти</span>
                        </button>
                        <button class="nav-btn logout-btn" style="display: none;">
                            <svg class="nav-icon" viewBox="0 0 24 24">
                                <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/>
                            </svg>
                            <span>Выйти</span>
                        </button>
                    </nav>
                </div>
                <div class="header-bottom">
                    <div class="days-tabs">
                        <button class="tab-btn active" data-day="monday">Понедельник</button>
                        <button class="tab-btn" data-day="tuesday">Вторник</button>
                        <button class="tab-btn" data-day="wednesday">Среда</button>
                        <button class="tab-btn" data-day="thursday">Четверг</button>
                        <button class="tab-btn" data-day="friday">Пятница</button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="app-main">
            <!-- Schedule Section -->
            <section class="schedule-section">
                <div class="schedule-content"></div>
            </section>

            <!-- Admin Panel -->
            <section class="admin-section" style="display: none;">
                <div class="admin-panel">
                    <h2>Панель администратора</h2>
                    <div class="admin-controls">
                        <div class="select-group">
                            <div class="select-wrapper">
                                <label for="daySelect">День недели</label>
                                <select id="daySelect" class="styled-select">
                                    <option value="monday">Понедельник</option>
                                    <option value="tuesday">Вторник</option>
                                    <option value="wednesday">Среда</option>
                                    <option value="thursday">Четверг</option>
                                    <option value="friday">Пятница</option>
                                </select>
                            </div>
                            <div class="select-wrapper">
                                <label for="lessonSelect">Предмет</label>
                                <select id="lessonSelect" class="styled-select"></select>
                            </div>
                        </div>
                        <div class="textarea-wrapper">
                            <label for="homeworkInput">Домашнее задание</label>
                            <textarea id="homeworkInput" class="styled-textarea" placeholder="Введите домашнее задание..."></textarea>
                        </div>
                        <button id="addHomeworkBtn" class="primary-btn">
                            <svg class="btn-icon" viewBox="0 0 24 24">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                            <span>Добавить домашнее задание</span>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Login Modal -->
    <div class="modal" style="display: none;">
        <div class="modal-content">
            <h2>Вход в систему</h2>
            <form class="login-form">
                <div class="input-group">
                    <div class="input-wrapper">
                        <label for="password">Пароль</label>
                        <input type="password" id="password" placeholder="Введите пароль" required>
                    </div>
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Запомнить меня</label>
                    </div>
                </div>
                <button type="submit" class="primary-btn">
                    <svg class="btn-icon" viewBox="0 0 24 24">
                        <path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/>
                    </svg>
                    <span>Войти</span>
                </button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
