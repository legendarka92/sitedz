<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9Г Класс - Расписание</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <div class="theme-switcher" onclick="toggleTheme()">
        <svg class="theme-icon" viewBox="0 0 24 24">
            <path class="sun-icon" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
            <path class="moon-icon" style="display:none;" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
    </div>

    <div class="container">
        <header>
            <h1>9Г Класс</h1>
            <nav id="main-nav">
                <button class="nav-btn active" onclick="showMainContent()">Главная</button>
                <button class="nav-btn" onclick="showLoginModal()">Вход</button>
            </nav>
            <nav id="admin-nav" style="display: none;">
                <button class="nav-btn active" onclick="showMainContent()">Главная</button>
                <button class="nav-btn" onclick="showAdminPanel()">Админ панель</button>
                <button class="nav-btn" onclick="logout()">Выход</button>
            </nav>
        </header>

        <main>
            <div id="schedule-container" class="content-section">
                <div class="tabs">
                    <button class="tab-btn active" data-day="monday">Понедельник</button>
                    <button class="tab-btn" data-day="tuesday">Вторник</button>
                    <button class="tab-btn" data-day="wednesday">Среда</button>
                    <button class="tab-btn" data-day="thursday">Четверг</button>
                    <button class="tab-btn" data-day="friday">Пятница</button>
                </div>
                <div id="schedule-content">
                    <!-- Schedule will be loaded here -->
                </div>
            </div>

            <div id="login-modal" class="modal" style="display: none;">
                <div class="modal-content">
                    <h2>Вход в админ панель</h2>
                    <input type="password" id="admin-code" placeholder="Введите код входа">
                    <div class="checkbox-container">
                        <input type="checkbox" id="remember-login" checked>
                        <label for="remember-login">Запомнить вход</label>
                    </div>
                    <button onclick="login()">Войти</button>
                </div>
            </div>

            <div id="admin-panel" class="content-section" style="display: none;">
                <h2>Админ Панель</h2>
                <div class="admin-controls">
                    <select id="day-select">
                        <option value="monday">Понедельник</option>
                        <option value="tuesday">Вторник</option>
                        <option value="wednesday">Среда</option>
                        <option value="thursday">Четверг</option>
                        <option value="friday">Пятница</option>
                    </select>
                    <select id="lesson-select">
                        <!-- Will be populated based on selected day -->
                    </select>
                    <textarea id="homework-input" placeholder="Введите домашнее задание"></textarea>
                    <button onclick="addHomework()">Добавить ДЗ</button>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
